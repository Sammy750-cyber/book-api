services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: book-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: book_api
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    container_name: book-api-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: book_api
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d book_api"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: